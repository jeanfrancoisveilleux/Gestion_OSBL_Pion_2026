<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        --bleu: #1a73e8;
        --bleu-fonce: #1558b0;
        --bordure: #d9dfe8;
        --fond: #f7f9fc;
        --texte: #202124;
        --secondaire: #5f6368;
        --vert: #137333;
        --rouge: #b3261e;
        --orange: #b06000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 22px;
        color: var(--texte);
        font-family: Arial, sans-serif;
        font-size: 14px;
        background: #fff;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 21px;
      }

      .sous-titre {
        margin-bottom: 18px;
        color: var(--secondaire);
      }

      .resume {
        display: grid;
        grid-template-columns: 130px 1fr 150px;
        gap: 14px;
        align-items: center;
        margin-bottom: 18px;
        padding: 14px;
        border: 1px solid var(--bordure);
        border-radius: 10px;
        background: var(--fond);
      }

      .etiquette {
        margin-bottom: 4px;
        color: var(--secondaire);
        font-size: 12px;
      }

      .valeur {
        font-weight: 600;
      }

      .montant-bancaire {
        color: var(--bleu-fonce);
        font-size: 22px;
        font-weight: 700;
        text-align: right;
      }

      .montant-bancaire.negatif {
        color: var(--rouge);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        padding: 9px 7px;
        color: var(--secondaire);
        font-size: 12px;
        font-weight: 600;
        text-align: left;
        border-bottom: 1px solid var(--bordure);
      }

      td {
        padding: 8px 7px;
        border-bottom: 1px solid #edf0f4;
        vertical-align: middle;
      }

      select,
      input {
        width: 100%;
        height: 36px;
        padding: 7px 9px;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        color: var(--texte);
        background: #fff;
        font: inherit;
      }

      select:focus,
      input:focus {
        outline: 2px solid #d2e3fc;
        border-color: var(--bleu);
      }

      /* Colonnes mode revenu */
      .col-composante { width: 42%; }
      .col-quantite   { width: 13%; }
      .col-prix       { width: 17%; }
      .col-montant    { width: 18%; }
      .col-action     { width: 10%; text-align: center; }

      /* Colonnes mode dépense */
      .col-compte     { width: 34%; }
      .col-programme  { width: 22%; }
      .col-projet     { width: 18%; }
      .col-montant-dep{ width: 16%; }

      .montant-ligne {
        font-weight: 600;
        white-space: nowrap;
      }

      .supprimer {
        width: 34px;
        height: 34px;
        padding: 0;
        border: 1px solid #e1e5eb;
        border-radius: 6px;
        color: var(--rouge);
        background: #fff;
        cursor: pointer;
        font-size: 18px;
      }

      .supprimer:hover {
        background: #fce8e6;
      }

      .barre-ajout {
        margin-top: 12px;
      }

      .secondaire {
        padding: 9px 13px;
        border: 1px solid #c8ced8;
        border-radius: 6px;
        color: var(--bleu-fonce);
        background: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      .secondaire:disabled {
        color: #9aa0a6;
        cursor: default;
      }

      .totaux {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
      }

      .carte-total {
        width: 300px;
        padding: 13px 15px;
        border: 1px solid var(--bordure);
        border-radius: 9px;
        background: var(--fond);
      }

      .ligne-total {
        display: flex;
        justify-content: space-between;
        margin: 5px 0;
      }

      .reste {
        padding-top: 8px;
        border-top: 1px solid var(--bordure);
        font-weight: 700;
      }

      .pret      { color: var(--vert); }
      .incomplet { color: var(--orange); }
      .depassement { color: var(--rouge); }

      .message {
        min-height: 21px;
        margin-top: 13px;
        font-size: 13px;
      }

      .message.erreur { color: var(--rouge); }
      .message.succes { color: var(--vert); }

      .pied {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--bordure);
      }

      .principal {
        padding: 10px 17px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: var(--bleu);
        cursor: pointer;
        font-weight: 700;
      }

      .principal:hover:not(:disabled) { background: var(--bleu-fonce); }
      .principal:disabled { background: #a9c7f5; cursor: default; }

      .section-fc {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
        padding: 14px;
        border: 1px solid var(--bordure);
        border-radius: 10px;
        background: var(--fond);
      }

      .fc-groupe {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .fc-label {
        font-size: 12px;
        color: var(--secondaire);
        font-weight: 600;
      }

      .fc-label .requis {
        color: var(--rouge);
        margin-left: 2px;
      }
    </style>
  </head>
  <body>
    <h1 id="titreInterface">Répartir la transaction</h1>
    <div class="sous-titre" id="sousTitre">
      Ajoutez jusqu'à cinq composantes. Le total doit correspondre exactement au montant bancaire.
    </div>

    <div class="resume">
      <div>
        <div class="etiquette">Date</div>
        <div class="valeur" id="date"></div>
      </div>
      <div>
        <div class="etiquette">Transaction bancaire</div>
        <div class="valeur" id="description"></div>
      </div>
      <div>
        <div class="etiquette" style="text-align:right">Montant</div>
        <div class="montant-bancaire" id="montantBancaire"></div>
      </div>
    </div>

    <div id="sectionFournisseur" style="display:none">
      <div class="section-fc">
        <div class="fc-groupe">
          <label class="fc-label" for="selFournisseur">
            Fournisseur<span class="requis">*</span>
          </label>
          <select id="selFournisseur"></select>
        </div>
        <div class="fc-groupe">
          <label class="fc-label" for="selContact">Contact</label>
          <select id="selContact"></select>
        </div>
      </div>
    </div>

    <table>
      <thead id="enTetes"></thead>
      <tbody id="lignes"></tbody>
    </table>

    <div class="barre-ajout">
      <button class="secondaire" id="ajouter" type="button">
        + Ajouter une composante
      </button>
    </div>

    <div class="totaux">
      <div class="carte-total">
        <div class="ligne-total">
          <span>Total réparti</span>
          <strong id="totalReparti">0,00 $</strong>
        </div>
        <div class="ligne-total reste">
          <span>Reste à répartir</span>
          <strong id="reste">0,00 $</strong>
        </div>
      </div>
    </div>

    <div class="message" id="message"></div>

    <div class="pied">
      <button class="secondaire" type="button" onclick="google.script.host.close()">
        Annuler
      </button>
      <button class="principal" id="enregistrer" type="button">
        Enregistrer et comptabiliser
      </button>
    </div>

    <script>
      const DONNEES = <?!= donnees ?>;
      const MAX_LIGNES = 5;
      const EST_DEPENSE = DONNEES.typeMouvement === 'depense';
      let lignes = [];
      let idFournisseurSelectionne = '';
      let idContactSelectionne = '';

      const formatMonetaire = new Intl.NumberFormat('fr-CA', {
        style: 'currency',
        currency: 'CAD'
      });

      function nombre(valeur) {
        if (typeof valeur === 'string') {
          valeur = valeur.replace(',', '.');
        }
        const resultat = Number(valeur);
        return Number.isFinite(resultat) ? resultat : 0;
      }

      function arrondir(valeur) {
        return Math.round((nombre(valeur) + Number.EPSILON) * 100) / 100;
      }

      /* ── Mode revenu ─────────────────────────────────────── */

      function prixParDefaut(composante) {
        const option = DONNEES.options.find(
          element => element.valeur === composante
        );
        return option ? nombre(option.prix) : 0;
      }

      function creerSelectionComposante(composante, index) {
        const selection = document.createElement('select');
        selection.setAttribute('aria-label', 'Composante');

        const vide = document.createElement('option');
        vide.value = '';
        vide.textContent = 'Sélectionner…';
        selection.appendChild(vide);

        DONNEES.options.forEach(option => {
          const element = document.createElement('option');
          element.value = option.valeur;
          element.textContent = option.valeur;
          element.selected = option.valeur === composante;
          selection.appendChild(element);
        });

        selection.addEventListener('change', () => {
          lignes[index].composante = selection.value;
          lignes[index].prixUnitaire = prixParDefaut(selection.value);
          afficherLignes();
        });

        return selection;
      }

      function creerChampNombreRevenu(valeur, etiquette, callback, pas) {
        const champ = document.createElement('input');
        champ.type = 'number';
        champ.min = '0';
        champ.step = pas;
        champ.value = valeur;
        champ.setAttribute('aria-label', etiquette);
        champ.addEventListener('input', () => {
          callback(nombre(champ.value));
          calculerTotaux();
        });
        return champ;
      }

      function afficherLignesRevenu() {
        const corps = document.getElementById('lignes');
        corps.textContent = '';

        lignes.forEach((ligne, index) => {
          const rangee = document.createElement('tr');

          const celluleComposante = document.createElement('td');
          celluleComposante.appendChild(creerSelectionComposante(ligne.composante, index));

          const celluleQuantite = document.createElement('td');
          celluleQuantite.appendChild(
            creerChampNombreRevenu(
              ligne.quantite, 'Quantité',
              valeur => { lignes[index].quantite = valeur; }, '1'
            )
          );

          const cellulePrix = document.createElement('td');
          cellulePrix.appendChild(
            creerChampNombreRevenu(
              ligne.prixUnitaire, 'Prix unitaire',
              valeur => { lignes[index].prixUnitaire = valeur; }, '0.01'
            )
          );

          const celluleMontant = document.createElement('td');
          celluleMontant.className = 'montant-ligne';
          celluleMontant.dataset.index = index;

          const celluleAction = document.createElement('td');
          celluleAction.className = 'col-action';
          celluleAction.appendChild(creerBoutonSupprimer(index, function() {
            if (lignes.length === 0) {
              lignes.push({ composante: '', quantite: 1, prixUnitaire: 0 });
            }
          }));

          rangee.append(celluleComposante, celluleQuantite, cellulePrix, celluleMontant, celluleAction);
          corps.appendChild(rangee);
        });

        document.getElementById('ajouter').disabled = lignes.length >= MAX_LIGNES;
        calculerTotaux();
      }

      /* ── Mode dépense ────────────────────────────────────── */

      function creerSelectionCompte(codeSelectionne, index) {
        const sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Compte comptable');

        const vide = document.createElement('option');
        vide.value = '';
        vide.textContent = 'Sélectionner un compte…';
        sel.appendChild(vide);

        (DONNEES.comptes || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.code;
          opt.textContent = c.code + ' – ' + c.nom;
          opt.selected = c.code === codeSelectionne;
          sel.appendChild(opt);
        });

        sel.addEventListener('change', () => {
          lignes[index].compte = sel.value;
          calculerTotaux();
        });

        return sel;
      }

      function creerSelectionProgramme(valeurSelectionnee, index) {
        const sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Programme');

        const vide = document.createElement('option');
        vide.value = '';
        vide.textContent = '(Aucun)';
        sel.appendChild(vide);

        (DONNEES.programmes || []).forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          opt.selected = p === valeurSelectionnee;
          sel.appendChild(opt);
        });

        sel.addEventListener('change', () => {
          lignes[index].programme = sel.value;
        });

        return sel;
      }

      function creerSelectionProjet(valeurSelectionnee, index) {
        const sel = document.createElement('select');
        sel.setAttribute('aria-label', 'Projet');

        const vide = document.createElement('option');
        vide.value = '';
        vide.textContent = '(Aucun)';
        sel.appendChild(vide);

        (DONNEES.projets || []).forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.id + (p.nom ? ' – ' + p.nom : '');
          opt.selected = p.id === valeurSelectionnee;
          sel.appendChild(opt);
        });

        sel.addEventListener('change', () => {
          lignes[index].projet = sel.value;
        });

        return sel;
      }

      function creerChampMontantDepense(valeur, index) {
        const champ = document.createElement('input');
        champ.type = 'number';
        champ.min = '0.01';
        champ.step = '0.01';
        champ.value = valeur || '';
        champ.setAttribute('aria-label', 'Montant');
        champ.addEventListener('input', () => {
          lignes[index].montant = nombre(champ.value);
          calculerTotaux();
        });
        return champ;
      }

      function afficherLignesDepense() {
        const corps = document.getElementById('lignes');
        corps.textContent = '';

        lignes.forEach((ligne, index) => {
          const rangee = document.createElement('tr');

          const tdCompte = document.createElement('td');
          tdCompte.className = 'col-compte';
          tdCompte.appendChild(creerSelectionCompte(ligne.compte, index));

          const tdProg = document.createElement('td');
          tdProg.className = 'col-programme';
          tdProg.appendChild(creerSelectionProgramme(ligne.programme, index));

          const tdProj = document.createElement('td');
          tdProj.className = 'col-projet';
          tdProj.appendChild(creerSelectionProjet(ligne.projet, index));

          const tdMontant = document.createElement('td');
          tdMontant.className = 'col-montant-dep';
          tdMontant.appendChild(creerChampMontantDepense(ligne.montant || '', index));

          const tdAction = document.createElement('td');
          tdAction.className = 'col-action';
          tdAction.appendChild(creerBoutonSupprimer(index, function() {
            if (lignes.length === 0) {
              lignes.push({ compte: '', programme: '', projet: '', montant: 0 });
            }
          }));

          rangee.append(tdCompte, tdProg, tdProj, tdMontant, tdAction);
          corps.appendChild(rangee);
        });

        document.getElementById('ajouter').disabled = lignes.length >= MAX_LIGNES;
        calculerTotaux();
      }

      /* ── Fournisseur / Contact (mode dépense) ───────────── */

      function filtrerContacts(idFournisseur) {
        const sel = document.getElementById('selContact');
        // Utiliser la variable de module (pas sel.value) pour savoir quel contact garder
        const valeurActuelle = idContactSelectionne;
        sel.textContent = '';

        const vide = document.createElement('option');
        vide.value = '';
        vide.textContent = '(Aucun)';
        sel.appendChild(vide);

        let trouve = false;
        (DONNEES.contacts || [])
          .filter(function(c) {
            return !idFournisseur || c.idFournisseur === idFournisseur;
          })
          .forEach(function(c) {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.nom;
            if (c.id === valeurActuelle) {
              opt.selected = true;
              trouve = true;
            }
            sel.appendChild(opt);
          });

        // Si le contact actuel n'appartient pas au nouveau fournisseur, vider
        if (!trouve) {
          sel.value = '';
          idContactSelectionne = '';
        }
      }

      function initialiserSectionFournisseur() {
        document.getElementById('sectionFournisseur').style.display = '';

        const selF = document.getElementById('selFournisseur');
        selF.textContent = '';

        const vide = document.createElement('option');
        vide.value = '';
        vide.textContent = 'Sélectionner un fournisseur…';
        selF.appendChild(vide);

        (DONNEES.fournisseurs || []).forEach(function(f) {
          const opt = document.createElement('option');
          opt.value = f.id;
          opt.textContent = f.id + ' – ' + f.nom;
          opt.selected = f.id === (DONNEES.idFournisseur || '');
          selF.appendChild(opt);
        });

        idFournisseurSelectionne = DONNEES.idFournisseur || '';
        idContactSelectionne = DONNEES.idContact || '';

        filtrerContacts(idFournisseurSelectionne);

        const selC = document.getElementById('selContact');
        selC.value = idContactSelectionne;

        selF.addEventListener('change', function() {
          idFournisseurSelectionne = selF.value;
          // filtrerContacts gère le reset de idContactSelectionne si nécessaire
          filtrerContacts(idFournisseurSelectionne);
          calculerTotaux();
        });

        selC.addEventListener('change', function() {
          idContactSelectionne = selC.value;
        });
      }

      /* ── Commun ──────────────────────────────────────────── */

      function creerBoutonSupprimer(index, apresSuppressionVide) {
        const bouton = document.createElement('button');
        bouton.type = 'button';
        bouton.className = 'supprimer';
        bouton.textContent = '×';
        bouton.title = 'Supprimer cette ligne';
        bouton.addEventListener('click', () => {
          lignes.splice(index, 1);
          apresSuppressionVide();
          afficherLignes();
        });
        return bouton;
      }

      function afficherLignes() {
        if (EST_DEPENSE) {
          afficherLignesDepense();
        } else {
          afficherLignesRevenu();
        }
      }

      function calculerTotaux() {
        let total = 0;

        if (EST_DEPENSE) {
          lignes.forEach((ligne, index) => {
            const montant = arrondir(nombre(ligne.montant));
            total += montant;
          });

          total = arrondir(total);
          const cible = arrondir(DONNEES.montantAbsolu || 0);
          const reste = arrondir(cible - total);
          const lignesValides = lignes.length > 0 &&
            lignes.every(l => l.compte && nombre(l.montant) > 0) &&
            !!idFournisseurSelectionne;

          mettreAJourAffichageTotaux(total, reste, lignesValides);
        } else {
          lignes.forEach((ligne, index) => {
            const montant = arrondir(
              nombre(ligne.quantite) * nombre(ligne.prixUnitaire)
            );
            total += montant;

            const cellule = document.querySelector(
              '.montant-ligne[data-index="' + index + '"]'
            );
            if (cellule) {
              cellule.textContent = formatMonetaire.format(montant);
            }
          });

          total = arrondir(total);
          const reste = arrondir(nombre(DONNEES.montant) - total);
          const lignesValides = lignes.length > 0 && lignes.every(ligne =>
            ligne.composante &&
            nombre(ligne.quantite) > 0 &&
            nombre(ligne.prixUnitaire) >= 0
          );

          mettreAJourAffichageTotaux(total, reste, lignesValides);
        }
      }

      function mettreAJourAffichageTotaux(total, reste, lignesValides) {
        const elementReste = document.getElementById('reste');
        const bouton = document.getElementById('enregistrer');

        document.getElementById('totalReparti').textContent =
          formatMonetaire.format(total);
        elementReste.textContent = formatMonetaire.format(reste);
        elementReste.className =
          Math.abs(reste) < 0.005
            ? 'pret'
            : reste < 0
              ? 'depassement'
              : 'incomplet';

        bouton.disabled = !(Math.abs(reste) < 0.005 && lignesValides);
      }

      function afficherMessage(texte, type) {
        const message = document.getElementById('message');
        message.textContent = texte || '';
        message.className = 'message ' + (type || '');
      }

      function enregistrer() {
        const bouton = document.getElementById('enregistrer');
        bouton.disabled = true;
        bouton.textContent = 'Enregistrement…';
        afficherMessage('', '');

        const appel = google.script.run
          .withSuccessHandler(resultat => {
            afficherMessage(resultat.message, 'succes');
            bouton.textContent = 'Enregistrée';
            setTimeout(() => google.script.host.close(), 1300);
          })
          .withFailureHandler(erreur => {
            afficherMessage(
              erreur && erreur.message ? erreur.message : 'Une erreur est survenue.',
              'erreur'
            );
            bouton.textContent = DONNEES.boutonPrincipal || 'Enregistrer';
            calculerTotaux();
          });

        if (EST_DEPENSE) {
          const donnees = {
            idImport: DONNEES.idImport,
            idTransactionSource: DONNEES.idTransactionSource || '',
            idFournisseur: idFournisseurSelectionne,
            idContact: idContactSelectionne,
            lignes: lignes.map(l => ({
              compte: l.compte,
              programme: l.programme || '',
              projet: l.projet || '',
              montant: nombre(l.montant)
            }))
          };

          if (DONNEES.mode === 'revision') {
            appel.enregistrerRevisionDepenseBancaireMixte(donnees);
          } else {
            appel.enregistrerEtComptabiliserDepenseBancaireMixte(donnees);
          }
        } else {
          const donnees = {
            idImport: DONNEES.idImport,
            idTransactionSource: DONNEES.idTransactionSource || '',
            lignes: lignes.map(ligne => ({
              composante: ligne.composante,
              quantite: nombre(ligne.quantite),
              prixUnitaire: nombre(ligne.prixUnitaire)
            }))
          };

          if (DONNEES.mode === 'revision') {
            appel.enregistrerRevisionTransactionMixte(donnees);
          } else {
            appel.enregistrerEtComptabiliserTransactionMixte(donnees);
          }
        }
      }

      /* ── Initialisation ──────────────────────────────────── */

      document.getElementById('titreInterface').textContent =
        DONNEES.titre || 'Répartir la transaction';

      document.getElementById('enregistrer').textContent =
        DONNEES.boutonPrincipal || 'Enregistrer et comptabiliser';

      document.getElementById('date').textContent = DONNEES.date;
      document.getElementById('description').textContent = DONNEES.description;

      const elemMontant = document.getElementById('montantBancaire');
      elemMontant.textContent = formatMonetaire.format(DONNEES.montant);
      if (DONNEES.montant < 0) {
        elemMontant.classList.add('negatif');
      }

      if (EST_DEPENSE) {
        document.getElementById('sousTitre').textContent =
          "Ajoutez jusqu'à cinq lignes de dépense. " +
          "Le total doit correspondre à la valeur absolue du montant bancaire.";

        document.getElementById('ajouter').textContent = '+ Ajouter une ligne';

        document.getElementById('enTetes').innerHTML =
          '<tr>' +
          '<th class="col-compte">Compte comptable</th>' +
          '<th class="col-programme">Programme</th>' +
          '<th class="col-projet">Projet</th>' +
          '<th class="col-montant-dep">Montant ($)</th>' +
          '<th class="col-action"></th>' +
          '</tr>';

        lignes = DONNEES.lignes.map(l => ({
          compte: l.compte || '',
          programme: l.programme || '',
          projet: l.projet || '',
          montant: nombre(l.montant || 0)
        }));

        initialiserSectionFournisseur();
      } else {
        document.getElementById('enTetes').innerHTML =
          '<tr>' +
          '<th class="col-composante">Composante</th>' +
          '<th class="col-quantite">Quantité</th>' +
          '<th class="col-prix">Prix unitaire</th>' +
          '<th class="col-montant">Montant</th>' +
          '<th class="col-action"></th>' +
          '</tr>';

        lignes = DONNEES.lignes.map(ligne => ({
          composante: ligne.composante || '',
          quantite: nombre(ligne.quantite || 1),
          prixUnitaire: nombre(ligne.prixUnitaire || 0)
        }));
      }

      document.getElementById('ajouter').addEventListener('click', () => {
        if (lignes.length < MAX_LIGNES) {
          if (EST_DEPENSE) {
            lignes.push({ compte: '', programme: '', projet: '', montant: 0 });
          } else {
            lignes.push({ composante: '', quantite: 1, prixUnitaire: 0 });
          }
          afficherLignes();
        }
      });

      document.getElementById('enregistrer').addEventListener('click', enregistrer);

      afficherLignes();
    </script>
  </body>
</html>
